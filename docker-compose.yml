version: '3.8'

# ==============================================================================
# Kollamo.ai — Complete Multi-Container Orchestration Stack
# Services: PostgreSQL 16, Redis 7, FastAPI Backend, Celery Worker, Nginx Frontend
# ==============================================================================

services:
  # 1. Relational Database (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: kollamo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kollamo_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kollamo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kollamo-network

  # 2. In-Memory Broker & Cache (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: kollamo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kollamo-network

  # 3. FastAPI Analytical API Server
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: kollamo-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      APP_SECRET_KEY: ${APP_SECRET_KEY:-kollamo-production-secret-token-2026}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kollamo_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ALLOWED_CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - kollamo-network

  # 4. Celery Asynchronous Processing Worker
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: kollamo-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kollamo_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - kollamo-network

  # 5. Production Nginx SPA & API Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kollamo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kollamo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kollamo-network:
    driver: bridge
