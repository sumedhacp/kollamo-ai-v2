name: Kollamo.ai Continuous Integration & Release Gates

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'phase/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Audit for Credentials and Structural Integrity
  security-and-lint-audit:
    name: Security & Secret Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for Accidental Secrets
        run: |
          echo "Scanning for credential leaks and unencrypted secrets..."
          ! git grep -i -E "youtube_api_key\s*=\s*['\"][A-Za-z0-9_-]{20,}['\"]" .
          ! git grep -i -E "postgres://.*:[^@]+@" .
          ! git grep -i -E "BEGIN (RSA|OPENSSH) PRIVATE KEY" .
        shell: bash

  # 2. Backend & ML Python Verification Suite
  backend-and-ml-verification:
    name: Backend & ML Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install Backend & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Full Pytest Suite (Backend & ML)
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///test_ci.db
          YOUTUBE_API_KEY: mock-ci-test-key
        run: |
          python -m pytest backend/tests ml/tests -v

  # 3. Frontend Verification Suite (Vitest, TypeCheck & Build)
  frontend-verification:
    name: Frontend Quality Gates (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Strict Type-Check
        run: npm run type-check

      - name: Run Vitest Unit & Journey Suites
        run: npm test

      - name: Compile Production Vite Bundle
        run: npm run build

  # 4. Docker Container Configuration Validation
  docker-validation:
    name: Docker Configuration & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
