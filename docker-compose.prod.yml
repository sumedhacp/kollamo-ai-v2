version: '3.8'

# ==============================================================================
# Kollamo.ai — Production Orchestration Stack with Resource Limits
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: kollamo-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kollamo_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kollamo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kollamo-prod-net

  redis:
    image: redis:7-alpine
    container_name: kollamo-redis-prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kollamo-prod-net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: kollamo-backend-prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kollamo_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      ALLOWED_CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS:-https://kollamo.ai,https://app.kollamo.ai}
      LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3072M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - kollamo-prod-net

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: kollamo-worker-prod
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kollamo_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3072M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - kollamo-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kollamo-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kollamo-prod-net

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  kollamo-prod-net:
    driver: bridge
